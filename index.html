<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pesquisa de Satisfação</title>
</head>

<body>

    <h1>Formulário HTML</h1>

    <h2>Pesquisa de Satisfação</h2>

    <form action="">

        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" required
        placeholder="Digite seu nome completo"><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required
        placeholder="Digite seu E-mail"><br><br>

        <label for="telefone">Telefone:</label><br>
        <input type="tel" id="telefone" name="telefone" required
        placeholder="(00) 00000-0000"><br><br>

        <label for="idade">Idade: </label><br>
        <input type="number" id="Idade" required placeholder="Digite sua Idade" min="18" max="120"><br><br>


        <h3>Avaliação Geral</h3>

        <input type="radio" name="avaliacao" id="otimo">
        <label for="otimo">Ótimo</label><br>

        <input type="radio" name="avaliacao" id="bom">
        <label for="bom">Bom</label><br>

        <input type="radio" name="avaliacao" id="regular">
        <label for="regular">Regular</label><br>

        <input type="radio" name="avaliacao" id="ruim">
        <label for="ruim">Ruim</label><br>


        <h3>Serviços Utilizados</h3>

        <input type="checkbox" id="atendimento" name="servicos">
        <label for="atendimento">Atendimento</label><br>

        <input type="checkbox" id="suporte" name="servicos">
        <label for="suporte">Suporte</label><br>

        <input type="checkbox" id="treinamento" name="servicos">
        <label for="treinamento">Treinamento</label><br>

        <input type="checkbox" id="consultoria" name="servicos">
        <label for="consultoria">Consultoria</label><br><br>


        <h3>Unidade Atendida</h3>

        <select name="unidade" id="unidade" required>

            <option value="" disabled selected>
                Escolha a unidade
            </option>

            <option value="matriz">Unidade Limeira</option>
            <option value="centro">Unidade Santa Barbára</option>
            <option value="norte">Unidade Nova Odessa</option>
            <option value="sul">Unidade Americana</option>

        </select>

        <br><br>

        <button type="submit">Cadastrar</button>

    </form>

</body>
</html>
